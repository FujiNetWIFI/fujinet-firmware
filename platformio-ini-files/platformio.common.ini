; DO NOT EDIT THE FILE - IT WILL BE OVERWRITTEN BY REPOSITORY UPDATES
;
; PUT YOUR LOCAL CHANGES IN platformio.local.ini

;FujiNet PlatformIO Common Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[fujinet]
;esp32_platform_version = 6.3.2
esp32_platform_version = 6.10.0
esp32_platform_packages = 
esp32s3_platform_version = 6.10.0
esp32s3_platform_packages =

; SPIFFS/LITTLEFS
flash_filesystem = FLASH_LITTLEFS

[platformio]
description = FujiNet retro computer to ESP32 WiFi Multifunction Firmware
default_envs = ${fujinet.build_board}
data_dir = ./data/${fujinet.build_platform}

[env]
framework = espidf
; DO NOT redefine extra_scripts in a board ini. A plain key replaces this
; whole list, and "+=" doesn't survive create-platformio-ini.py either (its
; merge strips the "+" before PlatformIO parses it) -- so a board that
; respells the list silently loses build_pico.py and its contamination
; guarantee. This does not apply to .github/workflows/platformio.release-*.ini,
; which are passed as the *local* ini where merge_ini_files does honour "+=".
extra_scripts =
    pre:build_packages.py
    pre:build_version.py
    pre:build_webui.py
    pre:build_pico.py
    post:build_merge.py
;    post:build_firmwarezip.py ; Optional, build firmware ZIP file for flash tool
lib_ldf_mode = off ; off chain deep chain+ deep+
board_build.filesystem = littlefs

; COM1, /dev/ttyUSB0, /dev/tty.SLAB_USBtoUART etc.
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

upload_speed = 460800
monitor_speed = 460800

monitor_filters = esp32_exception_decoder, time
check_skip_packages = yes

build_flags =
    -D ${fujinet.build_platform}
    -D ${fujinet.flash_filesystem}
    -D CMAKE_EXPORT_COMPILE_COMMANDS=ON
    -D DEBUG_SPEED=${env.monitor_speed}

# [fujinet] section allowed values.
# copy one of the build_board values to your platformio.local.ini under [fujinet], or read the build-sh.md docs.

;build_platform = BUILD_ATARI
;build_bus      = SIO
;build_board    = fujinet-atari-v1       ; FujiNet for Atari v1.0 and up
;build_board    = fujinet-v1-8mb         ; Atari generic/custom with 8mb flash
;build_board    = fujinet-v1-4mb         ; Atari generic/custom with 4mb flash

;build_platform = BUILD_ADAM
;build_bus      = ADAMNET
;build_board    = fujinet-adam-v1       ; FujiNet for Coleco ADAM v1.0

;build_platform = BUILD_APPLE
;build_bus      = IWM
;build_board    = fujiapple-rev0         ; FujiApple Rev 0 Prototype

;build_platform = BUILD_MAC
;build_bus      = MAC
;build_board    = fujimac-rev0         ; Use FujiApple Rev 0 Prototype for Mac 68000

;build_platform = BUILD_IEC
;build_bus      = IEC
;build_board    = fujinet-iec            ; Commodore IEC using Atari FujiNet
;build_board    = fujiloaf-rev0          ; Commodore IEC FujiLoaf Rev0 Prototype
;build_board    = fujiapple-iec          ; Commodore IEC using FujiApple Rev0
;build_board    = fujinet-iec-lolin-d32  ; Commodore IEC using Lolin D32 Pro
;build_board    = fujinet-iec-nugget     ; Commodore IEC using Lolin D32 Pro "Nugget"

;build_platform = BUILD_LYNX
;build_bus      = comlynx
;build_board    = fujinet-lynx-prototype ; Lynx Prototype PCB
;build_board    = fujinet-lynx-devkitc   ; Lynx with basic DEVKITC

;build_platform = BUILD_S100
;build_bus      = s100Bus
;build_board    = fujinet-s100-v1-8mb    ; ESP32-DEVKITC-VE

;build_platform = BUILD_RS232
;build_bus      = rs232
;build_board    = fujinet-rs232-rev0      ; RS232 Rev0 Prototype Carrier

;build_platform   = BUILD_CX16
;build_bus        = cx16
;build_board      = fujinet-cx16

;build_platform = BUILD_RC2014
;build_bus      = rc2014spi
;build_board    = fujinet-rc2014spi-rev0   ; RC2014 prototype based on ESP32-DEVKITC-VE

;build_platform = BUILD_H89
;build_bus      = H89
;build_board    = fujinet-heathkit-h89

;build_platform = BUILD_COCO
;build_bus      = DRIVEWIRE
;build_board    = fujinet-coco-devkitc      ; Color Computer Drivewire using ESP32-DEVKITC-VE
;build_board    = fujinet-coco-lolin-d32-dw ; Color Computer Drivewire using Lolin D32 Pro

# ---------------------------------------------------------------------------
# [fujinet] companion-MCU (RP2040/RP2350) build keys, read by the shared
# build_pico.py "pre:" extra_script above and (for merge_bin) build_merge.py.
# Set these in a board's own build-platforms/platformio-<board>.ini, inside
# its [fujinet] section (create-platformio-ini.py copies that section
# verbatim into the generated ini; PlatformIO itself ignores unknown keys in
# a non-[env] section -- this is the same trick build_bus/platform_name
# already use). Presence of pico_src is what enables the feature for a
# board; every other key is optional with the default shown.
#
# Key                    Default                          Meaning
# ---------------------- -------------------------------- --------------------------------------------------------
# pico_src               (none -- enables the feature)    Dir holding the companion firmware's top-level
#                                                          CMakeLists.txt/Makefile.
# pico_repo              (none)                           Out-of-tree source: git URL to shallow-clone instead of
#                                                          building from something already in-tree.
# pico_repo_ref          required when pico_repo is set    A PINNED ref (commit SHA, never a branch).
# pico_repo_dir          pico/_external/<repo name>        Where the clone lands; pico_src then points inside it.
# pico_build             cmake-ninja                       cmake-ninja | cmake-make | make | command
# pico_build_dir         build                             Relative to pico_src.
# pico_build_type        Release                           Passed as -DCMAKE_BUILD_TYPE=.
# pico_board             (unset)                           Passed as -DPICO_BOARD=; omitted entirely when unset
#                                                          (some CMakeLists, e.g. pico/coco's, set their own default).
# pico_cmake_args        (empty)                           Multi-line, one argv-ish token per line (shlex.split,
# pico_make_args         (empty)                           no shell). Supports the {board}/{pico_board}/
# pico_command           (empty)                           {build_type}/{src}/{build_dir}/{sdk} placeholders.
# pico_toolchain         arm-none-eabi-gcc (cmake modes)   Whitespace list of executables required on PATH.
# pico_sdk_path          $PICO_SDK_PATH, else               Exported into every child process env as PICO_SDK_PATH.
#                        /usr/share/pico-sdk
# pico_artifacts         (empty)                           Multi-line "blobname = path", path relative to the
#                                                          build dir; a bare path defaults the name to the file
#                                                          stem. Supports the same placeholders as pico_cmake_args.
#                                                          Names become C string literals and must match
#                                                          ^[A-Za-z0-9][A-Za-z0-9_.-]*$.
# merge_bin              no                                Opt-in to build_merge.py folding
# merge_bin_name         <env>-merged.bin                  bootloader+partition-table+app into one flashable file.
#                                                          Deliberately NOT a pico_* key -- merging is an ESP-side
#                                                          concern usable without any companion MCU at all.
#
# Booleans accept yes/true/1/on case-insensitively; an unrecognised
# non-empty value is a hard error (a typo must not silently disable a
# feature). Placeholder expansion on pico_artifacts/pico_cmake_args/
# pico_make_args/pico_command is str.format_map with a defaulting dict --
# this is what lets pico_artifacts track Minty's
# OUTPUT_NAME "Minty_${PICO_BOARD}${OUTPUT_SUFFIX}" without repeating
# "fujicard" (see build-platforms/platformio-fujiversal-intv.ini).
#
# Policy: pico_repo is for development convenience only. Anything shipping
# in a release build should be vendored in-tree (as pico/intellivision's
# Minty fork is) -- a private repo needs a token in CI, and vendoring is
# what keeps a release build reproducible without network access.
#
# The examples below are DOCUMENTATION ONLY -- they are not enabled on any
# board by this comment block.
#
# ; in-tree, no PICO_BOARD (pico/coco's CMakeLists sets its own default)
# pico_src       = pico/coco
# pico_artifacts =
#     coco_cart = main.bin
#
# ; multi-artifact
# pico_src       = pico/mac
# pico_artifacts =
#     mac_commands     = commands.bin
#     mac_commands_uf2 = commands.uf2
#
# ; out-of-tree, pinned SHA (never a branch)
# pico_repo      = https://github.com/FujiNetWIFI/fujinet-cart-fw.git
# pico_repo_ref  = 6f1c2ad9c1a4b3e5f7d8091a2b3c4d5e6f708192
# pico_src       = pico/_external/fujinet-cart-fw/firmware
# pico_board     = fujicart
# pico_artifacts =
#     cart_fw = fujicart_{pico_board}.bin
