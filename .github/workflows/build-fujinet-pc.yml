# -*- indent-tabs-mode: nil; -*-

name: Build FujiNet-PC

on:
  push:
    # Do not build tags. Do not build release branch
    branches:
      - "**"
      - "!release"
    tags:
      - "!**"

  pull_request:
    # Do not build release branch
    branches:
      - "**"
      - "!release"

  workflow_dispatch:
    inputs:
      # buildType:
      #   description: 'Build Type'
      #   required: true
      #   type: choice
      #   options:
      #   - Debug
      #   - RelWithDebInfo
      #   - Release
      #   default: 'Debug'
      prepRelease:
        description: 'Prepare GitHub Release Draft'
        type: boolean
        default: false
      ref:
        description: 'Tag, branch or commit SHA'
        required: false
        default: 'master'
        type: string

  schedule:
    - cron: '12 3 * * *'

# env:
#   # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
#   BUILD_TYPE: ${{ github.event.inputs.buildType }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Ubuntu 24.04
            runner: '["self-hosted", "Linux", "X64", "fujinet-builder"]'
            container: '{"image":"ubuntu:24.04","options":"--add-host=host.docker.internal:host-gateway"}'
            target: ubuntu-24.04-amd64
            default-shell: bash
          # tahoe is an Intel VM, so this is a cross-build whose binary cannot be run there
          - name: macOS ARM
            container: 'null'
            target: macos-arm64
            runner: '["self-hosted", "macOS", "X64", "tahoe"]'
            arch: arm64
            skip-tests: '1'
            default-shell: bash
          # cross-built with MinGW-w64 on Linux; the tests run under Wine
          - name: Windows
            runner: '["self-hosted", "Linux", "X64", "fujinet-builder"]'
            container: '{"image":"ubuntu:24.04","options":"--add-host=host.docker.internal:host-gateway"}'
            target: windows-x64
            default-shell: bash
        fujinet_target:
          - ADAM
          - APPLE
          - ATARI
          - COCO
          - IEC
          - LYNX
          - RS232

    # continue-on-error: true
    name: "${{ matrix.os.name }}: Target ${{ matrix.fujinet_target }}"
    runs-on: ${{ fromJSON(matrix.os.runner) }}
    container: ${{ fromJSON(matrix.os.container) }}
    defaults:
      run:
        shell: ${{ matrix.os.default-shell }}
    outputs:
      fujinet_version: ${{ steps.version.outputs.fujinet }}
      build_date: ${{ steps.version.outputs.build_date }}

    steps:
    - name: '[Linux] Install base tools'
      if: ${{ startsWith(matrix.os.target, 'ubuntu') || startsWith(matrix.os.target, 'windows') }}
      shell: bash
      run: |
        MIRROR=http://mirrors.edge.kernel.org/ubuntu
        (echo > /dev/tcp/host.docker.internal/3142) 2>/dev/null \
          && MIRROR=http://host.docker.internal:3142/mirrors.edge.kernel.org/ubuntu
        sed -i "s|http://[a-z.]*ubuntu.com/ubuntu|$MIRROR|" /etc/apt/sources.list.d/ubuntu.sources
        apt-get update && apt-get install -y --no-install-recommends git curl wget ca-certificates build-essential make python3 python3-pip python3-venv cmake pkg-config zlib1g-dev libssl-dev libexpat1-dev gh jq zip unzip

    # The tahoe VM has no Homebrew, only the base macOS tools. cmake comes from
    # PyPI, held below 4 because the vendored subprojects declare pre-3.5
    # minimums that cmake 4 rejects; MbedTLS 3 and OpenSSL are built for the
    # one architecture this row targets.
    - name: '[macOS] Install build tools'
      if: ${{ startsWith(matrix.os.target, 'macos') }}
      run: |
        python3 -m venv "$RUNNER_TEMP/tools"
        "$RUNNER_TEMP/tools/bin/pip" install --quiet "cmake>=3.28,<4" ninja
        echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
        echo "CMAKE_OSX_ARCHITECTURES=${{ matrix.os.arch }}" >> "$GITHUB_ENV"
        echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
        # Apple clang 26 rejects the -fstack-clash-protection that libssh adds, and
        # the repo builds with -Werror.
        echo "CFLAGS=-Wno-error=unused-command-line-argument" >> "$GITHUB_ENV"
        echo "CXXFLAGS=-Wno-error=unused-command-line-argument" >> "$GITHUB_ENV"

    - name: '[macOS] Cache MbedTLS and OpenSSL'
      id: mac-deps-cache
      if: ${{ startsWith(matrix.os.target, 'macos') }}
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/deps
        key: mac-deps-mbedtls-3.6.5-4a11f17-openssl-3.5.0-636dfad-${{ matrix.os.arch }}

    - name: '[macOS] Build MbedTLS 3 and OpenSSL'
      if: ${{ startsWith(matrix.os.target, 'macos') && steps.mac-deps-cache.outputs.cache-hit != 'true' }}
      run: |
        DEPS="$RUNNER_TEMP/deps"
        mkdir -p "$DEPS" "$RUNNER_TEMP/src"
        cd "$RUNNER_TEMP/src"
        curl -fsSL -o mbedtls.tar.bz2 https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.5/mbedtls-3.6.5.tar.bz2
        echo "4a11f1777bb95bf4ad96721cac945a26e04bf19f57d905f241fe77ebeddf46d8  mbedtls.tar.bz2" | shasum -a 256 -c -
        tar -xjf mbedtls.tar.bz2
        cmake -S mbedtls-3.6.5 -B mbedtls-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF -DCMAKE_INSTALL_PREFIX="$DEPS/mbedtls"
        cmake --build mbedtls-build
        cmake --install mbedtls-build
        # openssl-3.5.0, by commit
        git init -q openssl-src
        cd openssl-src
        git fetch -q --depth 1 https://github.com/openssl/openssl.git 636dfadc70ce26f2473870570bfd9ec352806b1d
        git checkout -q FETCH_HEAD
        test "$(git rev-parse HEAD)" = 636dfadc70ce26f2473870570bfd9ec352806b1d
        ./Configure darwin64-arm64-cc no-shared no-tests --prefix="$DEPS/openssl" --libdir=lib
        make -j"$(sysctl -n hw.ncpu)" build_libs
        make install_dev

    - name: '[macOS] Point the build at MbedTLS and OpenSSL'
      if: ${{ startsWith(matrix.os.target, 'macos') }}
      run: |
        echo "MBEDTLS_ROOT_DIR=$RUNNER_TEMP/deps/mbedtls" >> "$GITHUB_ENV"
        echo "OPENSSL_ROOT_DIR=$RUNNER_TEMP/deps/openssl" >> "$GITHUB_ENV"

    - name: '[Ubuntu] Install MbedTLS'
      if: ${{ startsWith(matrix.os.target, 'ubuntu') && !endsWith(matrix.os.target, 'armhf') }}
      run: |
        apt-get update
        apt-get install -y libmbedtls-dev

    - name: '[Ubuntu armhf] Install cross toolchain and MbedTLS'
      if: ${{ endsWith(matrix.os.target, 'armhf') }}
      run: |
        dpkg --add-architecture armhf
        apt-get update
        apt-get install -y crossbuild-essential-armhf \
          libmbedtls-dev:armhf libssl-dev:armhf libexpat1-dev:armhf zlib1g-dev:armhf \
          libstdc++6:armhf

    - name: About ${{ matrix.os.name }}
      run: |
        echo "Building for ${{ matrix.os.name }} (${{ matrix.os.target }}) on ${{ matrix.os.runner }}"
        uname -a

    - name: '🧰 Checkout'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.inputs.ref != '' && github.event.inputs.ref || github.ref }}

    # The checkout belongs to the runner's user, not root, and build_version_pc.py runs git
    - name: Trust the workspace
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # - name: Fetch tags
    #   run: git fetch --prune --unshallow --tags

    - name: 'Install Python'
      if: ${{ !startsWith(matrix.os.target, 'macos') }}
      uses: actions/setup-python@v5
      id: cp310
      with:
        python-version: '3.10'

    - name: Check Python version (default)
      if: ${{ !startsWith(matrix.os.target, 'macos') }}
      run: |
        which python
        python --version
        printenv PATH
        printenv pythonLocation

    - name: Check Python version (from setup-python)
      if: ${{ !startsWith(matrix.os.target, 'macos') }}
      run: |
        echo '${{ steps.cp310.outputs.python-path }}'
        '${{ steps.cp310.outputs.python-path }}' --version

    - name: 'Install Python packages'
      if: ${{ !startsWith(matrix.os.target, 'macos') }}
      run: |
        '${{ steps.cp310.outputs.python-path }}' -m pip install -U Jinja2 pyyaml

    - name: '[Windows] Install MinGW-w64 and Wine'
      if: ${{ startsWith(matrix.os.target, 'windows') }}
      run: apt-get install -y --no-install-recommends ninja-build mingw-w64 wine wine64 xz-utils bzip2 perl

    - name: '[Windows] Cache MinGW dependencies'
      id: mingw-cache
      if: ${{ startsWith(matrix.os.target, 'windows') }}
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/mingw
        key: mingw-deps-${{ hashFiles('.github/workflows/mingw-deps.sh') }}

    - name: '[Windows] Build MinGW dependencies'
      if: ${{ startsWith(matrix.os.target, 'windows') && steps.mingw-cache.outputs.cache-hit != 'true' }}
      run: .github/workflows/mingw-deps.sh "$RUNNER_TEMP/mingw"

    - name: '[regular OS] 🚧 Build FujiNet-PC (matrix.fujinet_target)'
      if: ${{ !startsWith(matrix.os.target, 'windows') }}
      env:
        FUJINET_SKIP_TESTS: ${{ matrix.os.skip-tests }}
      run: |
        export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc 2>/dev/null || sysctl -n hw.ncpu)
        ./build.sh -y -p ${{ matrix.fujinet_target }} -- ${{ matrix.os.cmake-args }}

    # GCC rejects two things clang let through, and the repo builds with -Werror
    - name: '[Windows] 🚧 Build FujiNet-PC (matrix.fujinet_target)'
      if: ${{ startsWith(matrix.os.target, 'windows') }}
      env:
        WINEPREFIX: /tmp/wine
        WINEDEBUG: -all
      run: |
        export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
        WARN="-Wno-error=stringop-truncation -Wno-error=conversion-null"
        ./build.sh -y -p ${{ matrix.fujinet_target }} -- \
          -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/mingw/toolchain.cmake" \
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/mingw" -DMBEDTLS_ROOT_DIR="$RUNNER_TEMP/mingw" \
          -DCMAKE_CROSSCOMPILING_EMULATOR=wine \
          "-DCMAKE_C_FLAGS=$WARN" "-DCMAKE_CXX_FLAGS=$WARN"

    # - name: Configure CMake
    #   #run: cmake -B build -DFUJINET_TARGET=${{matrix.fujinet_target}} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
    #   run: cmake -B build -DFUJINET_TARGET=${{matrix.fujinet_target}} -DCMAKE_BUILD_TYPE=Release

    # - name: '🚧 Build FujiNet-PC'
    #   run: cmake --build build --target all -j 8

    # - name: Prepare dist
    #   run: cmake --build build --target dist

    - name: List dist
      working-directory: build/dist
      run: ls -la

    - name: 'Get build version'
      id: version
      run: |
        HEADER_FILE="include/version.h"
        VERSION=$(grep "FN_VERSION_FULL" "$HEADER_FILE" | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
        echo "fujinet=$VERSION" >> $GITHUB_OUTPUT
        echo "build_date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: 'Tar dist files'
      working-directory: build
      run: |
        mv dist fujinet-pc-${{ matrix.fujinet_target }}
        tar -cvf fujinet-pc-${{ matrix.fujinet_target }}_${{ steps.version.outputs.fujinet }}_${{ matrix.os.target }}.tar fujinet-pc-${{ matrix.fujinet_target }}

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: fujinet-pc-${{ matrix.fujinet_target }}_${{ steps.version.outputs.fujinet }}_${{ matrix.os.target }}
        path: build/fujinet-pc-${{ matrix.fujinet_target }}_${{ steps.version.outputs.fujinet }}_${{ matrix.os.target }}.tar

  release:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.prepRelease == 'true' }}
    # Create GitHub release
    runs-on: [self-hosted, Linux, X64, fujinet-builder]
    container:
      image: ubuntu:24.04
      options: --add-host=host.docker.internal:host-gateway
    name: Release
    needs: build

    steps:
    - name: Install base tools
      shell: bash
      run: |
        MIRROR=http://mirrors.edge.kernel.org/ubuntu
        (echo > /dev/tcp/host.docker.internal/3142) 2>/dev/null \
          && MIRROR=http://host.docker.internal:3142/mirrors.edge.kernel.org/ubuntu
        sed -i "s|http://[a-z.]*ubuntu.com/ubuntu|$MIRROR|" /etc/apt/sources.list.d/ubuntu.sources
        apt-get update && apt-get install -y --no-install-recommends git curl wget ca-certificates build-essential make python3 python3-pip python3-venv cmake pkg-config zlib1g-dev libssl-dev libexpat1-dev gh jq zip unzip

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: release

    - name: Display structure of downloaded files
      run: ls -lR release

    - name: Zip release files
      shell: bash
      working-directory: release
      run: |
        for D in fujinet-pc-*_*ubuntu* fujinet-pc-*_*macos*; do gzip -9v $D/fujinet-pc-*_*.tar; done
        for D in fujinet-pc-*_*windows*; do (cd $D; F=(fujinet-pc-*_*.tar); tar -xvf $F; rm -f $F; zip -r ${F%.*}.zip fujinet-pc-*); done

    - name: Prepare Release Draft
      if: ${{ github.event.inputs.prepRelease == 'true' }}
      uses: softprops/action-gh-release@v2
      with:
          name: "FujiNet-PC ${{ needs.build.outputs.fujinet_version }}"
          tag_name: ${{ needs.build.outputs.fujinet_version }}
          draft: true
          files: |
            release/fujinet-pc-*_*/fujinet-pc-*_*.tar.gz
            release/fujinet-pc-*_*/fujinet-pc-*_*.zip

    - name: Create Nightly Build Release
      if: ${{ github.event_name == 'schedule' }}
      uses: softprops/action-gh-release@v2
      with:
          name: "FujiNet-PC Nightly ${{ needs.build.outputs.build_date }}"
          body: |
            FujiNet-PC **${{ needs.build.outputs.fujinet_version }}** nightly builds for: Apple 2, Atari 8-bit and Tandy Color Computer
            ⚠️ There is NO guarantee that these builds work!! ⚠️
          tag_name: nightly_fn_pc_${{ needs.build.outputs.fujinet_version }}
          prerelease: true
          make_latest: false
          files: |
            release/fujinet-pc-*_*/fujinet-pc-*_*.tar.gz
            release/fujinet-pc-*_*/fujinet-pc-*_*.zip

  postrelease:
    if: ${{ github.event_name == 'schedule' }}
    # Delete old nightly releases
    runs-on: [self-hosted, Linux, X64, fujinet-builder]
    container:
      image: ubuntu:24.04
      options: --add-host=host.docker.internal:host-gateway
    name: Post-Release
    needs: release

    steps:
    - name: Install base tools
      shell: bash
      run: |
        MIRROR=http://mirrors.edge.kernel.org/ubuntu
        (echo > /dev/tcp/host.docker.internal/3142) 2>/dev/null \
          && MIRROR=http://host.docker.internal:3142/mirrors.edge.kernel.org/ubuntu
        sed -i "s|http://[a-z.]*ubuntu.com/ubuntu|$MIRROR|" /etc/apt/sources.list.d/ubuntu.sources
        apt-get update && apt-get install -y --no-install-recommends git curl wget ca-certificates build-essential make python3 python3-pip python3-venv cmake pkg-config zlib1g-dev libssl-dev libexpat1-dev gh jq zip unzip

    - name: 'Checkout'
      # Checkout, to make "gh" command working
      uses: actions/checkout@v4

    - name: Trust the workspace
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Delete old nightly releases
      run: |
        gh release list --json tagName,createdAt \
          --jq 'map(select(.tagName | test("^nightly_fn_pc"))) | sort_by(.createdAt)[0:-3][].tagName' |\
          xargs -I% sh -c 'echo Deleting release %; gh release delete % --cleanup-tag'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
