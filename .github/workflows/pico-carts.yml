# Build coverage for the RP2040 cartridge trees under pico/.
#
# These trees had none, which is exactly how a repo-wide rename of
# fujiCommandID_t reached pico/intellivision/firmware/include/fujibus.h and left
# `#define CMD::NET_OPEN 0x4F` -- not a valid macro name -- sitting in the tree
# for weeks. Nothing built it, so nothing noticed.

name: "pico cartridges"

on:
  push:
    branches:
      - "**"
      - "!release"
    paths:
      - "pico/**"
      - "build_pico.py"
      - "build-platforms/platformio-fujiversal-*.ini"
      - "platformio-ini-files/platformio.common.ini"
      - ".github/workflows/pico-carts.yml"
  pull_request:
    branches:
      - "**"
      - "!release"
    paths:
      - "pico/**"
      - "build_pico.py"
      - "build-platforms/platformio-fujiversal-*.ini"
      - "platformio-ini-files/platformio.common.ini"
      - ".github/workflows/pico-carts.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host-tests:
    name: "host tests (no hardware, no SDK)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The wire codec and the cartridge-image mapper are deliberately free of
      # pico-sdk and TinyUSB so they can be tested here rather than on a console.
      - name: Shared -- FujiBus codec
        working-directory: pico/common/host_test
        run: |
          gcc -Wall -Wextra -Werror -I../include \
              -o test_fujibus test_fujibus.c ../src/fujibus.c
          ./test_fujibus

      - name: Odyssey 2 -- cartridge image mapper
        working-directory: pico/o2/firmware/host_test
        run: |
          gcc -Wall -Wextra -Werror -I../include \
              -o test_o2map test_o2map.c ../src/o2map.c
          ./test_o2map

      - name: Intellivision -- FujiBus codec
        working-directory: pico/intellivision/firmware/host_test
        run: |
          gcc -Wall -Wextra -I.. -I../include \
              -o test_fujibus test_fujibus.c ../src/fujibus.c
          ./test_fujibus

      # Compile-only: this one is driven by a corpus of real Intellivision ROM
      # files, which are not in the repo. Running it needs `test_bootmap
      # <rom>...` against a local collection.
      - name: Intellivision -- boot map (compiles)
        working-directory: pico/intellivision/firmware/host_test
        run: |
          gcc -Wall -Wextra -I../include -o test_bootmap \
              test_bootmap.c ../src/bootmap.c ../src/memory.c ../src/utils.c

      - name: Astrocade -- cartridge image mapper
        working-directory: pico/astrocade/firmware/host_test
        run: |
          gcc -Wall -Wextra -Werror -I../include \
              -o test_astromap test_astromap.c ../src/astromap.c
          ./test_astromap

      # The v2 banking serve model vs MAME's rom_256k/rom_512k handlers,
      # transcribed verbatim as the reference: 2M fuzzed reads must match
      # byte-for-byte, bank state included, plus the exact hotspot
      # boundaries and the debugger's no-commit read.
      - name: Astrocade -- banked serve model
        working-directory: pico/astrocade/firmware/host_test
        run: |
          gcc -Wall -Wextra -Werror -I../include \
              -o test_bankserve test_bankserve.c ../src/astromap.c
          ./test_bankserve

      # The hotspot mailbox: read-pair register decode, the SEQ/ACKSEQ and
      # SLICE_ECHO interlocks, the DBC push receiver (through the port-owned
      # store, astromap-gated), and the refresh-sweep fuzz. MAME cannot
      # model Z80 refresh and its socket transport is synchronous, so this
      # is the only place those cases run.
      - name: Astrocade -- hotspot mailbox service
        working-directory: pico/astrocade/firmware/host_test
        run: |
          gcc -Wall -Wextra -Werror -I../include -I../../../common/include \
              -o test_fujimail test_fujimail.c ../src/fujimail.c ../src/astromap.c
          ./test_fujimail

      # The push store's flash bookkeeping: the idle erase sweep and its
      # guards, and whether a chunk pays for an erase or only a program.
      # stub/ models the part rather than faking it -- a program only clears
      # bits -- so a wrongly skipped erase corrupts the image here instead of
      # waiting for a cartridge that does not exist yet.
      - name: Astrocade -- push store flash bookkeeping
        working-directory: pico/astrocade/firmware/host_test
        run: |
          gcc -Wall -Wextra -Werror -Istub -I../include \
              -DFUJI_STORE_BINARY_END=0x1000u \
              -o test_fujistore test_fujistore.c ../src/fuji_store.c
          ./test_fujistore

      # The Channel F tests are the only ones in the family that cover a BUS
      # PROTOCOL rather than an address decode: the F8 has no address bus, so
      # the cart has to run a 32-state ROMC machine and track PC0/PC1/DC0/DC1
      # itself. test_romc replays golden traces captured from MAME's own F8
      # core; without traces present it skips, and test_busio still runs.
      - name: Channel F -- ROMC conformance and bus decode
        working-directory: pico/channelf/firmware/host_test
        run: make

      # The NES port keeps every hardware-free unit under one Makefile: the
      # FujiBus codec, the mapper engine against MAME handler transcriptions,
      # the bus decode and RMW signature, the PIO bank-table model, and the
      # mailbox service on the 4K arena.
      - name: NES -- host tests
        working-directory: pico/nes/firmware/host_test
        run: make

      # The mapper engine against MAME's own a5200 handlers, the bus observer
      # (skew, enables, repeats, the swap), the '541 glue, staging and the
      # hand-over, the mailbox service and the FujiBus codec.
      - name: Atari 5200 -- host tests
        working-directory: pico/atari-5200/firmware/host_test
        run: make

      - name: Arcadia -- FujiBus codec
        working-directory: pico/arcadia/firmware/host_test
        run: |
          gcc -Wall -Wextra -Werror -I.. -I../include \
              -o test_fujibus test_fujibus.c ../src/fujibus.c
          ./test_fujibus

      # The connector decode is the one thing the RP2040 serve loop and the
      # MAME device MUST agree on byte-for-byte (A12 = chip select, A13 =
      # block, A14 not wired -> $6000 aliases the hotspots): swept exhaustively.
      - name: Arcadia -- cartridge image mapper
        working-directory: pico/arcadia/firmware/host_test
        run: |
          gcc -Wall -Wextra -Werror -I../include \
              -o test_arcmap test_arcmap.c ../src/arcmap.c
          ./test_arcmap

      # The hotspot mailbox: read-pair register decode, the SEQ/ACKSEQ and
      # SLICE_ECHO interlocks, the DBC push receiver, and the stray-read
      # fuzz. MAME cannot model bus strays and its socket transport is
      # synchronous, so this is the only place those cases run.
      - name: Arcadia -- hotspot mailbox service
        working-directory: pico/arcadia/firmware/host_test
        run: |
          gcc -Wall -Wextra -Werror -I../include \
              -o test_fujimail test_fujimail.c ../src/fujimail.c ../src/arcmap.c
          ./test_fujimail

      # The Emerson connector has no read strobe, so core1 de-duplicates
      # hotspot events on a pin-state change rather than an Enable edge. That
      # decision (arcadia_bus_observe) is fuzzed here with synthetic 2650 bus
      # traces -- the one thing MAME's edge-free access model cannot exercise.
      - name: Arcadia -- bus edge dedupe
        working-directory: pico/arcadia/firmware/host_test
        run: |
          gcc -Wall -Wextra -Werror -I../include \
              -o test_busedge test_busedge.c
          ./test_busedge

  a5200-console-client:
    name: "Atari 5200 6502 clients"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cc65
        run: sudo apt-get update && sudo apt-get install -y cc65
      # The bring-up clients, each through tools/checkrom.py, and
      # testrom/fujinet.inc against fuji_mailbox.h.
      - name: Build the clients
        working-directory: pico/atari-5200
        run: ./build.sh

  o2-console-client:
    name: "Odyssey 2 8048 client"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Macro Assembler AS. There is NO distro package for it -- Debian's and
      # Ubuntu's "asl"/"asl-*" are the Advanced Simulation Library, something
      # else entirely -- so it is built from the release-tracking mirror of
      # Alfred Arnold's source. build.sh picks a native asl up from PATH in
      # preference to its wine fallback.
      - name: Cache Macro Assembler AS
        id: cache-asl
        uses: actions/cache@v4
        with:
          path: ~/asl
          key: asl-upstream-${{ runner.os }}-v1

      - name: Build Macro Assembler AS
        if: steps.cache-asl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch upstream \
            https://github.com/Macroassembler-AS/asl-releases.git /tmp/asl-src
          cd /tmp/asl-src
          cp Makefile.def-samples/Makefile.def-i386-unknown-linux2.x.x Makefile.def
          # The sample pins -march=i586, which will not build on x86-64.
          sed -i 's|^CFLAGS.*|CFLAGS = -O2 -w|' Makefile.def
          make -j"$(nproc)"
          mkdir -p ~/asl
          # Just the two binaries build.sh uses. `make install` is not run: it
          # wants system directories, and the message catalogs are compiled
          # into the binaries, so nothing else has to travel with them.
          cp asl p2bin ~/asl/

      - name: Put AS on PATH
        run: echo "$HOME/asl" >> "$GITHUB_PATH"

      # Assembles all four carts. tools/checklayout.py runs on each and fails
      # the build if two pinned routines have grown into each other -- p2bin
      # only says "overlapping memory allocation!" with no location, and every
      # routine here is placed with an explicit org because conditional jumps on
      # the 8048 are page-relative.
      - name: Assemble
        working-directory: pico/o2
        run: ./build.sh hello fujitest fujiboot fujicfg

      # No code may live above $7FF. CALL and JMP carry 11 address bits and the
      # twelfth comes from the MB flag, which the assembler sets on the
      # assumption that MB tracks the PC's own A11 -- an assumption a call from
      # the high bank into the low one silently breaks, sending the next call
      # 2K lower, into the console BIOS.
      - name: Check no code in the high bank
        working-directory: pico/o2
        run: |
          python3 - <<'PY'
          import re, sys
          bad = 0
          for cart in ("fujitest", "fujiboot", "fujicfg"):
              hi = [int(m.group(1), 16)
                    for line in open("build/%s.lst" % cart, errors="ignore")
                    for m in [re.match(r"^(?:\(\d+\))?\s*\d+/\s*([0-9A-F]{3,4}) : (?:[0-9A-F]{2} )+", line)]
                    if m and 0x800 <= int(m.group(1), 16) < 0xD00]
              print("%-10s code bytes in the high bank: %d" % (cart, len(hi)))
              bad += len(hi)
          sys.exit(1 if bad else 0)
          PY

      - name: Decode every built cart with the image mapper
        working-directory: pico/o2
        run: |
          gcc -Wall -Wextra -Werror -Ifirmware/include -o /tmp/test_o2map \
              firmware/host_test/test_o2map.c firmware/src/o2map.c
          /tmp/test_o2map build/hello.bin build/fujitest.bin \
                          build/fujiboot.bin build/fujicfg.bin

  astrocade-console-client:
    name: "Astrocade Z80 clients"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # zmac is vendored (tools/zmac, public domain -- see its PROVENANCE.md)
      # because no distro packages it and there is no release mirror to pin.
      # build.sh compiles it on demand; tools/checkrom.py then enforces the
      # fuji_mailbox.h layout on every image: 0x55 sentinel, exactly 8K, the
      # claim signature, and nothing above the 0x1AFF ROM top. The banked
      # clients also run the packers' self-verification: mkbanked re-parses
      # its own output, and mkgame walks every bank of the synthetic
      # 256K/512K images with a pure-python transcription of the MAME read
      # handlers.
      - name: Assemble and validate
        working-directory: pico/astrocade
        run: ./build.sh fujitest fujiboot fujicfg fujibank gamebank

  channelf-console-client:
    name: "Channel F F8 clients"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Macro Assembler AS again, F3850 target this time. Same cache and build
      # recipe as the o2 job, so one AS build serves both.
      - name: Cache Macro Assembler AS
        id: cache-asl
        uses: actions/cache@v4
        with:
          path: ~/asl
          key: asl-upstream-${{ runner.os }}-v1

      - name: Build Macro Assembler AS
        if: steps.cache-asl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch upstream \
            https://github.com/Macroassembler-AS/asl-releases.git /tmp/asl-src
          cd /tmp/asl-src
          cp Makefile.def-samples/Makefile.def-i386-unknown-linux2.x.x Makefile.def
          sed -i 's|^CFLAGS.*|CFLAGS = -O2 -w|' Makefile.def
          make -j"$(nproc)"
          mkdir -p ~/asl
          cp asl p2bin ~/asl/

      - name: Put AS on PATH
        run: echo "$HOME/asl" >> "$GITHUB_PATH"

      # hello and romctest are plain 2K Videocarts; the rest are FujiNet
      # clients and must come out at exactly 16K with the "FUJI" claim at
      # $47FC, which tools/checkrom.py --claim enforces. A client that is short
      # -- or that lost the ORG -- would otherwise boot with the mailbox
      # silently dead.
      - name: Assemble the F8 clients
        working-directory: pico/channelf
        run: |
          ASL=$HOME/asl/asl P2BIN=$HOME/asl/p2bin \
            ./build.sh hello romctest fujitest fujiboot fujicfg

  nes-console-client:
    name: "NES 6502 clients"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cc65 from the distro is enough for ca65/ld65; the clients are pure
      # assembly. tools/checkrom.py then enforces the fuji_mailbox.h layout on
      # every image (header, claim, vectors, no RMW on the hotspot pages) and
      # the loader ROM's fixed entry points.
      - run: sudo apt-get update && sudo apt-get install -y cc65
      - name: Assemble and validate
        working-directory: pico/nes
        run: ./build.sh loader hello fujitest fujiboot

  arcadia-console-client:
    name: "Arcadia 2001 2650 clients"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Macro Assembler AS again (2650 target this time). Same cache and
      # build recipe as the o2 job; build.sh prefers a native asl on PATH.
      - name: Cache Macro Assembler AS
        id: cache-asl
        uses: actions/cache@v4
        with:
          path: ~/asl
          key: asl-upstream-${{ runner.os }}-v1

      - name: Build Macro Assembler AS
        if: steps.cache-asl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch upstream \
            https://github.com/Macroassembler-AS/asl-releases.git /tmp/asl-src
          cd /tmp/asl-src
          cp Makefile.def-samples/Makefile.def-i386-unknown-linux2.x.x Makefile.def
          sed -i 's|^CFLAGS.*|CFLAGS = -O2 -w|' Makefile.def
          make -j"$(nproc)"
          mkdir -p ~/asl
          cp asl p2bin ~/asl/

      - name: Put AS on PATH
        run: echo "$HOME/asl" >> "$GITHUB_PATH"

      # Assembles the three clients. tools/mkimage.py folds each $0000-$2FFF
      # flat into the 8K cart image and rejects code in the $1000-$1FFF
      # console-RAM hole or the mailbox pages; tools/checkrom.py then enforces
      # the fuji_mailbox.h layout (BCTA/RETC header, the claim, nothing above
      # the 0x1AFF ROM top).
      - name: Assemble
        working-directory: pico/arcadia
        run: ./build.sh fujitest fujiboot fujicfg

      # The 2650's return stack is 8 entries deep and on chip -- a call graph
      # deeper than that silently corrupts returns. Every client must stay
      # within it.
      - name: Check the 8-deep call stack
        working-directory: pico/arcadia
        run: |
          for c in fujitest fujiboot fujicfg; do
              python3 tools/checkdepth.py \
                  testrom/$c.asm testrom/fujilib.inc testrom/fujidisp.inc
          done

  cartridge-firmware:
    name: "RP2040 cartridge firmware"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Read pico-sdk version
        id: pico
        run: >-
          python3 -c "import configparser;
          p = configparser.ConfigParser(inline_comment_prefixes=(';', '#'), interpolation=None);
          p.read('platformio-ini-files/platformio.common.ini');
          print('sdk=' + p['fujinet']['pico_sdk_version'])" >> "$GITHUB_OUTPUT"

      # Pinned by [fujinet] pico_sdk_version, not master: an SDK that moves
      # under CI turns an unrelated upstream change into a red build.
      - uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: ${{ steps.pico.outputs.sdk }}
          path: pico-sdk
          submodules: true

      # build-essential builds the SDK's host tools (picotool, pioasm); the SDK
      # builds picotool without USB support, so it needs no libusb.
      - run: sudo apt-get update && sudo apt-get install -y
               build-essential cmake ninja-build
               gcc-arm-none-eabi libnewlib-arm-none-eabi

      # Both configurations: the FujiNet build is what ships, and the stock one
      # proves the vendored PicoPAC still builds with our changes applied.
      - name: Odyssey 2 cartridge (FujiNet)
        working-directory: pico/o2
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: ./build-cart.sh

      - name: Odyssey 2 cartridge (stock PicoPAC)
        working-directory: pico/o2
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: ./build-cart.sh --stock

      # Pulls no-OS-FatFS-SD (v3.6.2) and littlefs (master) over the network via
      # FetchContent. Its `git describe --tags` falls back to version 0.0 on a
      # shallow checkout, which is fine here.
      - name: Intellivision cartridge (fujicard)
        working-directory: pico/intellivision/firmware
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -B build -DPICO_BOARD=fujicard -DCMAKE_BUILD_TYPE=Release -G Ninja
          ninja -C build

      # build-cart.sh regenerates fujiconfigrom.h from the baked-in client,
      # so the Z80 side has to assemble first (the vendored zmac needs no
      # cross-tools beyond gcc).
      - name: Astrocade cartridge (fujicade)
        working-directory: pico/astrocade
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          ./build.sh fujitest fujiboot fujicfg
          ./build-cart.sh
          # The serve loop must live in SRAM: flash streaming suspends XIP
          # while core1 keeps serving the bus, so any flash-resident code on
          # that path is a live-lock on real hardware.
          grep -E '0x2000[0-9a-f]+\s+astrocade_core1_main$' \
              firmware/build-fujicade/fujicade.elf.map

      - name: Channel F Videocart (fujichannelf)
        working-directory: pico/channelf
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          # A placeholder client, so build-cart.sh has something to bake. The
          # real one comes from ./build.sh with Macro Assembler AS; this job
          # deliberately does not install it, so the firmware build stays
          # independent of the cross-assembler.
          mkdir -p build
          python3 - <<'PY'
          import pathlib
          img = bytearray(b'\xff' * 0x4000)
          img[0:2] = b'\x55\x00'
          img[0x3FFC:0x4000] = b'FUJI'
          pathlib.Path('build/fujitest.bin').write_bytes(img)
          PY
          ./build-cart.sh
          # The serve loop must live in SRAM. Here the reason is not latency --
          # a bus cycle is 2.2 us -- but that the loop may never miss a cycle:
          # with no address bus, a stalled cart has nothing to resynchronize
          # its shadow PC0/DC0 against and stays wrong for the rest of the
          # session.
          grep -E '0x2000[0-9a-f]+ +channelf_core1_main$' \
              firmware/build-fujichannelf/fujichannelf.elf.map

      # build-cart.sh bakes the loader ROM and a client into the firmware, so
      # the 6502 side assembles first. The RP2354B build runs entirely from
      # SRAM (copy_to_ram); tools/checksram.py asserts core1's symbols there.
      - name: NES cartridge (fujines_rp2354b)
        working-directory: pico/nes
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          sudo apt-get install -y cc65
          ./build.sh loader hello fujitest fujiboot
          ./build-cart.sh

      # CONFIG comes from firmware/baked/; tools/checksram.py asserts that
      # core1's loop and every branch it takes stay in SRAM.
      - name: Atari 5200 cartridge (fuji5200_rp2354b)
        working-directory: pico/atari-5200
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: ./build-cart.sh --baked

      - name: Arcadia cartridge (fujiarcadia)
        working-directory: pico/arcadia
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          # A placeholder client, so build-cart.sh has something to bake; this
          # job does not install AS (the 2650 client job assembles the real ones).
          mkdir -p build
          python3 - <<'PY'
          import pathlib
          img = bytearray(b'\xff' * 0x2000)
          img[0x1CFC:0x1D00] = b'FUJI'
          pathlib.Path('build/fujitest.bin').write_bytes(img)
          PY
          ./build-cart.sh
          # Same SRAM-residency rule as the Astrocade: the serve loop cannot
          # live in flash, or an XIP stall would freeze the bus.
          grep -E '0x2000[0-9a-f]+\s+arcadia_core1_main$' \
              firmware/build-fujiarcadia/fujiarcadia.elf.map

      # Drives the same [fujinet] pico_* keys the ESP32 build uses, so a
      # broken ini key, a missing ROM, or an uninitialized submodule fails
      # here rather than halfway through an ESP-IDF build. --no-generate
      # skips writing the embedded-blob source, which nothing here compiles.
      - name: Fujiversal companion firmware (via build_pico.py)
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          for board in fujiversal-intv fujiversal-drivewire fujiversal-msx; do
            echo "::group::$board"
            python3 build_pico.py "$board" --no-generate
            echo "::endgroup::"
          done
