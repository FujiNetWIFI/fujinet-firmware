name: "FujiNet CI"

on:
  push:
    # Do not build tags. Do not build release branch
    branches:
      - "**"
      - "!release"
    tags:
      - "!**"
  pull_request:
    # Do not build release branch
    branches:
      - "**"
      - "!release"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tagged-release:
    name: "PlatformIO CI"
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        target-platform:
          - ADAM
          - APPLE
          - ATARI
          - ATARI-esp32-s3-wroom-1-n16r8
          - COCO
          - IEC-LOLIN-D32
          - IEC-NUGGET
          - LYNX
          - LYNX-S3
          - RS232
          - FUJIVERSAL-INTV
          - FUJIVERSAL-DRIVEWIRE
          - FUJIVERSAL-MSX
        # Fujiversal boards also build a companion RP2040/RP2350 cartridge
        # firmware, which needs an ARM toolchain the other boards do not.
        include:
          - target-platform: FUJIVERSAL-INTV
            pico: true
          - target-platform: FUJIVERSAL-DRIVEWIRE
            pico: true
          - target-platform: FUJIVERSAL-MSX
            pico: true

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.1'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install setuptools
        pip install --upgrade platformio
        pip install Jinja2
        pip install pyyaml

    - name: Show python version
      run: python --version

    - name: Show pio system info
      run: pio system info

    - name: Show pio location
      run: pip show platformio


    # Fujiversal boards build a companion RP2350 cartridge firmware as part of
    # their ESP32 build. The ARM toolchain comes from the runner's apt and must
    # meet the pico_* minimums in platformio.common.ini; build.sh -y clones the
    # pinned pico-sdk. build-essential builds the SDK's host tools (picotool,
    # pioasm). Every other board skips this.
    - name: Install companion-MCU toolchain
      if: matrix.pico
      run: |
        sudo apt-get update && sudo apt-get install -y \
          build-essential cmake ninja-build \
          gcc-arm-none-eabi libnewlib-arm-none-eabi

    - name: Create PlatformIO INI for Build
      run: cd "$GITHUB_WORKSPACE" && /usr/bin/bash ./build.sh -y -l "$GITHUB_WORKSPACE"/.github/workflows/platformio.release-${{ matrix.target-platform }}.ini -i "$GITHUB_WORKSPACE"/platformio-generated.ini

    - name: Show platformio.ini
      run: cat "$GITHUB_WORKSPACE"/platformio-generated.ini

    - name: Get Old Version
      id: version
      run: echo "VERSION=$(grep '#define FN_VERSION_FULL' /home/runner/work/fujinet-firmware/fujinet-firmware/include/version.h | sed 's/^.*"\(.*\)".*$/\1/')" >> $GITHUB_OUTPUT

    - name: Create "version.txt" file
      run: echo "${{ steps.version.outputs.VERSION }}.${{ matrix.target-platform }}" > "$GITHUB_WORKSPACE"/version.txt

    - name: Build release
      run: cd "$GITHUB_WORKSPACE" && /usr/bin/bash ./build.sh -y -z -l "$GITHUB_WORKSPACE"/.github/workflows/platformio.release-${{ matrix.target-platform }}.ini -i "$GITHUB_WORKSPACE"/platformio-generated.ini

    - name: Upload firmware zip for ${{ matrix.target-platform }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.target-platform }}
        path: firmware/**
