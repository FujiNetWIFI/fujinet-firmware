name: "FujiNet Nightly Builds"

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  KEEP_NIGHTLIES: 3

jobs:
  cleanup-nightly:
    name: "Clean up old nightly assets"
    if: ${{ vars.RUN_NIGHTLY == 'true' }}
    runs-on: [self-hosted, Linux, X64, fujinet-builder]
    container:
      image: ubuntu:24.04
      options: --add-host=host.docker.internal:host-gateway
    steps:
      - name: Install base tools
        shell: bash
        run: |
          MIRROR=http://mirrors.edge.kernel.org/ubuntu
          (echo > /dev/tcp/host.docker.internal/3142) 2>/dev/null \
            && MIRROR=http://host.docker.internal:3142/mirrors.edge.kernel.org/ubuntu
          sed -i "s|http://[a-z.]*ubuntu.com/ubuntu|$MIRROR|" /etc/apt/sources.list.d/ubuntu.sources
          apt-get update && apt-get install -y --no-install-recommends git curl wget ca-certificates build-essential make python3 python3-pip python3-venv gh jq zip unzip
      - uses: actions/checkout@v4

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Delete old nightly assets (keep last ${{ env.KEEP_NIGHTLIES }})
        continue-on-error: true
        run: |
          KEEP=${{ env.KEEP_NIGHTLIES }}
          SKIP=$((KEEP + 1))
          gh release view nightly --json assets --jq '.assets[].name' | \
            sort -r | \
            tail -n +${SKIP} | \
            xargs -r -I {} gh release delete-asset nightly {} --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  nightly-release:
    name: "PlatformIO CI"
    needs: cleanup-nightly
    if: ${{ vars.RUN_NIGHTLY == 'true' }}
    runs-on: [self-hosted, Linux, X64, fujinet-builder]
    container:
      image: ubuntu:24.04
      options: --add-host=host.docker.internal:host-gateway
      volumes:
        - ${{ github.event_name == 'pull_request' && 'fujinet-ci-cache:/ci-cache:ro' || 'fujinet-ci-cache:/ci-cache' }}
    strategy:
      matrix:
        target-platform: [ATARI, ATARI-8mb, ADAM, APPLE, IEC-LOLIN-D32, IEC-NUGGET, COCO, MASTERIES-REVAB, MASTERIES-REVA-SPIFIX, RS232, FUJIVERSAL-INTV, FUJIVERSAL-INTV-PIRTO-II-DUO, FUJIVERSAL-DRIVEWIRE, FUJIVERSAL-MSX]
        # Fujiversal boards also build a companion RP2040/RP2350 cartridge
        # firmware, which needs an ARM toolchain the other boards do not.
        include:
          - target-platform: FUJIVERSAL-INTV
            pico: true
          - target-platform: FUJIVERSAL-INTV-PIRTO-II-DUO
            pico: true
          - target-platform: FUJIVERSAL-DRIVEWIRE
            pico: true
          - target-platform: FUJIVERSAL-MSX
            pico: true

    steps:
    - name: Install base tools
      shell: bash
      run: |
        MIRROR=http://mirrors.edge.kernel.org/ubuntu
        (echo > /dev/tcp/host.docker.internal/3142) 2>/dev/null \
          && MIRROR=http://host.docker.internal:3142/mirrors.edge.kernel.org/ubuntu
        sed -i "s|http://[a-z.]*ubuntu.com/ubuntu|$MIRROR|" /etc/apt/sources.list.d/ubuntu.sources
        apt-get update && apt-get install -y --no-install-recommends git curl wget ca-certificates build-essential make python3 python3-pip python3-venv gh jq zip unzip
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: Trust the workspace
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Restore PlatformIO from the host cache
      run: .github/workflows/pio-cache.sh restore ${{ matrix.target-platform }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.1'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install setuptools
        pip install --upgrade platformio
        pip install Jinja2
        pip install pyyaml

    - name: Show python version
      run: python --version

    - name: Show pio system info
      run: pio system info

    - name: Show pio location
      run: pip show platformio


    # Fujiversal boards build a companion RP2350 cartridge firmware as part of
    # their ESP32 build. The ARM toolchain comes from the runner's apt and must
    # meet the pico_* minimums in platformio.common.ini; build.sh -y clones the
    # pinned pico-sdk. build-essential builds the SDK's host tools (picotool,
    # pioasm). Every other board skips this.
    - name: Install companion-MCU toolchain
      if: matrix.pico
      run: |
        apt-get update && apt-get install -y \
          build-essential cmake ninja-build \
          gcc-arm-none-eabi libnewlib-arm-none-eabi

    - name: Create PlatformIO INI for Build
      run: cd "$GITHUB_WORKSPACE" && /usr/bin/bash ./build.sh -y -l "$GITHUB_WORKSPACE"/.github/workflows/platformio.release-${{ matrix.target-platform }}.ini -i "$GITHUB_WORKSPACE"/platformio-generated.ini

    - name: Show platformio.ini
      run: cat "$GITHUB_WORKSPACE"/platformio-generated.ini

    - uses: benjlevesque/short-sha@v3.0
      id: short-sha
      with:
        length: 6

    - name: Get Old Version
      id: version
      run: |
        YEAR=$(date +%Y)
        DAY=$(date +%j)
        echo "VERSION=n${YEAR}.${DAY}-${{ steps.short-sha.outputs.sha }}" >> $GITHUB_OUTPUT

    - name: Get Commit Date
      id: commit-date
      run: echo "COMMIT_DATE=$(git --no-pager log -1 --pretty='format:%cd' --date='format:%Y-%m-%d %H:%M:%S')">> $GITHUB_OUTPUT

    - name: Set Nightly Version in Firmware
      id: nightly-version
      run: sed -i 's/#define FN_VERSION_FULL "[^"]*"/#define FN_VERSION_FULL "${{ steps.version.outputs.VERSION }}"/' "$GITHUB_WORKSPACE"/include/version.h

    - name: Set Version Date in Firmware
      id: nightly-date
      run: sed -i 's/#define FN_VERSION_DATE "[^"]*"/#define FN_VERSION_DATE "${{ steps.commit-date.outputs.COMMIT_DATE }}"/' "$GITHUB_WORKSPACE"/include/version.h

    - name: Create "version.txt" file
      run: echo "${{ steps.version.outputs.VERSION }}.${{ matrix.target-platform }}" > ./version.txt

    - name: Build release
      run: cd "$GITHUB_WORKSPACE" && /usr/bin/bash ./build.sh -y -z -l "$GITHUB_WORKSPACE"/.github/workflows/platformio.release-${{ matrix.target-platform }}.ini -i "$GITHUB_WORKSPACE"/platformio-generated.ini

    - name: Save PlatformIO to the host cache
      if: success() && github.event_name != 'pull_request'
      run: .github/workflows/pio-cache.sh save ${{ matrix.target-platform }}

    - name: Standardize Firmware Name
      run: mv ./firmware/fujinet*.zip ./firmware/fujinet-${{ matrix.target-platform }}-${{ steps.version.outputs.VERSION }}-nightly.zip

    - name: Create Release
      id: create-release
      uses: softprops/action-gh-release@v2.2.2
      with:
#        body_path: ${{ github.workspace }}/.github/nightly-release.txt
        body: |
          Nightly builds of the following firmware:

          - `fujinet-ADAM-*` - Coleco Adam
          - `fujinet-APPLE-*` - Apple 2
          - `fujinet-ATARI-*` - Atari 8-bit
          - `fujinet-IEC-LOLIN-D32-*` - Commodore IEC

          # ⚠️ There is NO guarantee that these builds work!! ⚠️

          These builds are provided 100% ***AS-IS*** with absolutely no guarantee that they will work. Only use these builds if you know what you are doing & are willing to troubleshoot any problems on your own.

          Of course reporting any bugs you run across would be greatly appreciated but they should be accompanied by console logs & any other appropriate details that might help in troubleshooting the issues. Generally the [FujiNet Discord](https://discord.gg/yKtS3fxU) is the best place to discuss any issues you find in these builds.

          Current commit: [${{ steps.short-sha.outputs.sha }}](${{ github.server_url }}/${{ github.repository }}/commits/${{ github.sha }})
        name: Nightly Builds
        prerelease: true
        files: firmware/fujinet-*-nightly.zip
        tag_name: nightly
        generate_release_notes: true
        make_latest: false
