# autobuild.yml and build-fujinet-pc.yml skip a pull request that changes only Markdown,
# which would leave master's required checks waiting forever; this reports them passed.
name: Docs only

on:
  pull_request:
    branches:
      - "**"
      - "!release"
    paths:
      - "**.md"

permissions:
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.files.outputs.docs_only }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate --jq '.[].filename' \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files")
          if [ -n "$files" ] && ! grep -qv '\.md$' <<< "$files"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  required:
    needs: changes
    # When skipped, the job keeps its unexpanded name, so it can't pass for a real build
    if: needs.changes.outputs.docs_only == 'true'
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Master's required status checks
        check:
          - "PlatformIO CI (ADAM)"
          - "PlatformIO CI (APPLE)"
          - "PlatformIO CI (ATARI)"
          - "PlatformIO CI (COCO)"
          - "PlatformIO CI (LYNX-S3)"
          - "PlatformIO CI (RS232)"
          - "Ubuntu 24.04: Target APPLE"
          - "Ubuntu 24.04: Target ATARI"
          - "Ubuntu 24.04: Target COCO"
          - "Windows: Target APPLE"
          - "Windows: Target ATARI"
          - "Windows: Target COCO"
          - "macOS ARM: Target APPLE"
          - "macOS ARM: Target ATARI"
          - "macOS ARM: Target COCO"
    steps:
      - run: echo "Only Markdown changed"
