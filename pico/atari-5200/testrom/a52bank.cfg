# a52bank.cfg -- bank 1 (the last, the power-on bank) of a 64K Super Cart
# FujiNet client. Every bank is this image except $A000-$AFFF, which build.sh
# fills from bank0.s, so code anywhere else is common to both and a bank
# switch can happen mid-routine. $BFC0-$BFFF are the Super Cart's hotspots:
# nothing but the claim and the header lives there.
MEMORY {
    ZP:    file = "", start = $0019, size = $00E7;
    RAM:   file = "", start = $0300, size = $0D00;
    ROM:   file = %O, start = $4000, size = $6000, fill = yes, fillval = $FF;
    BANKA: file = %O, start = $A000, size = $1000, fill = yes, fillval = $FF;
    ARENA: file = %O, start = $B000, size = $0800, fill = yes, fillval = $FF;
    ROM2:  file = %O, start = $B800, size = $07C0, fill = yes, fillval = $FF;
    HOT:   file = %O, start = $BFC0, size = $0020, fill = yes, fillval = $FF;
    CLAIM: file = %O, start = $BFE0, size = $0008, fill = yes, fillval = $00;
    HDR:   file = %O, start = $BFE8, size = $0018;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp,  optional = yes;
    BSS:      load = RAM,   type = bss, optional = yes;
    STARTUP:  load = ROM,   type = ro;
    CODE:     load = ROM,   type = ro;
    RODATA:   load = ROM,   type = ro,  optional = yes;
    DLIST:    load = ROM,   type = ro,  align = $100;
    FONT:     load = ROM,   type = ro,  align = $400;
    BANKCODE: load = BANKA, type = ro;
    CLAIM:    load = CLAIM, type = ro;
    HEADER:   load = HDR,   type = ro;
}
