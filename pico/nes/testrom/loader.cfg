# loader.cfg -- the 2K loader ROM the cart serves at $5800-$5FFF.
MEMORY {
    ZP:     start = $0000, size = $0010, type = rw;
    LOADER: start = $5800, size = $0800, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp, optional = yes;
    LOADER:   load = LOADER, type = ro;
}
