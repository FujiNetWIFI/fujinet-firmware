# nes.cfg -- a FujiNet NES bring-up client: NROM-256, 8K WRAM, CHR-RAM.
#
# The claim "FUJI" sits at $FFF0, the last 16 bytes of PRG just below the
# vectors; it is what keeps the mailbox alive after the cart boots this image.
MEMORY {
    ZP:      start = $0000, size = $00E0, type = rw, define = yes;
    RAM:     start = $0300, size = $0500, type = rw, define = yes;
    WRAM:    start = $6000, size = $2000, type = rw, define = yes;
    HEADER:  start = $0000, size = $0010, file = %O, fill = yes;
    PRG:     start = $8000, size = $7FF0, file = %O, fill = yes, fillval = $FF, define = yes;
    CLAIM:   start = $FFF0, size = $000A, file = %O, fill = yes, fillval = $FF;
    VECTORS: start = $FFFA, size = $0006, file = %O, fill = yes;
}
SEGMENTS {
    HEADER:   load = HEADER,  type = ro;
    ZEROPAGE: load = ZP,      type = zp,  optional = yes;
    STARTUP:  load = PRG,     type = ro;
    CODE:     load = PRG,     type = ro;
    RODATA:   load = PRG,     type = ro;
    BSS:      load = RAM,     type = bss, define = yes, optional = yes;
    WBSS:     load = WRAM,    type = bss, define = yes, optional = yes;
    CLAIM:    load = CLAIM,   type = ro;
    VECTORS:  load = VECTORS, type = ro;
}
