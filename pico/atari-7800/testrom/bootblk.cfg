# bootblk.cfg -- the power-on boot block: exactly 4K at $F000.
MEMORY {
    BOOT:  file = %O, start = $F000, size = $0F00, fill = yes, fillval = $FF;
    ENTRY: file = %O, start = $FF00, size = $0080, fill = yes, fillval = $FF;
    SIG:   file = %O, start = $FF80, size = $0078, fill = yes, fillval = $FF;
    FLAGS: file = %O, start = $FFF8, size = $0008;
}
SEGMENTS {
    BOOT:  load = BOOT,  type = ro;
    ENTRY: load = ENTRY, type = ro;
    SIG:   load = SIG,   type = ro;
    FLAGS: load = FLAGS, type = ro;
}
