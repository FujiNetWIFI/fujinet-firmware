# a78bank.cfg -- a 64K banked FujiNet client (SuperGame with cart RAM, the
# claim's kind byte says so): three 16K banks that take turns at $8000, the
# fixed last bank at $C000 with the claim, and the cart's RAM at $4000.
MEMORY {
    ZP:    file = "", start = $0040, size = $00A0;
    RAM:   file = "", start = $4000, size = $4000;
    BANK0: file = %O, start = $8000, size = $4000, fill = yes, fillval = $FF;
    BANK1: file = %O, start = $8000, size = $4000, fill = yes, fillval = $FF;
    BANK2: file = %O, start = $8000, size = $4000, fill = yes, fillval = $FF;
    ROM:   file = %O, start = $C000, size = $3F70, fill = yes, fillval = $FF;
    CLAIM: file = %O, start = $FF70, size = $000A, fill = yes, fillval = $00;
    SIG:   file = %O, start = $FF7A, size = $007E, fill = yes, fillval = $FF;
    VEC:   file = %O, start = $FFF8, size = $0008;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp,  optional = yes;
    BSS:      load = RAM,   type = bss, optional = yes;
    BANK0:    load = BANK0, type = ro;
    BANK1:    load = BANK1, type = ro;
    BANK2:    load = BANK2, type = ro;
    STARTUP:  load = ROM,   type = ro;
    CODE:     load = ROM,   type = ro;
    RODATA:   load = ROM,   type = ro,  optional = yes;
    FONT:     load = ROM,   type = ro,  align = $100;
    CLAIM:    load = CLAIM, type = ro;
    VECTORS:  load = VEC,   type = ro;
}
