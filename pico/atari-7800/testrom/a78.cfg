# a78.cfg -- a 32K FujiNet client: ROM at $8000, the cart's 16K of RAM at
# $4000 (the claim's RAM flag asks for it), the claim at $FF70.
MEMORY {
    ZP:    file = "", start = $0040, size = $00A0;
    RAM:   file = "", start = $4000, size = $4000;
    ROM:   file = %O, start = $8000, size = $7F70, fill = yes, fillval = $FF;
    CLAIM: file = %O, start = $FF70, size = $000A, fill = yes, fillval = $00;
    SIG:   file = %O, start = $FF7A, size = $007E, fill = yes, fillval = $FF;
    VEC:   file = %O, start = $FFF8, size = $0008;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp,  optional = yes;
    BSS:      load = RAM,   type = bss, optional = yes;
    STARTUP:  load = ROM,   type = ro;
    CODE:     load = ROM,   type = ro;
    RODATA:   load = ROM,   type = ro,  optional = yes;
    FONT:     load = ROM,   type = ro,  align = $100;
    CLAIM:    load = CLAIM, type = ro;
    VECTORS:  load = VEC,   type = ro;
}
