## IDF Component Manager Manifest File
dependencies:
  espressif/led_strip:
    version: "^3.1"
    # 3.1+ calls rmt_tx_switch_gpio(), new in ESP-IDF 5.4.2 (#1869).
    matches:
      - if: "idf_version >=5.4.2"
      - if: "idf_version <5.4.2"
        version: "~3.0.3"
    rules:
      - if: 'target in ["esp32s3"]'
  espressif/usb_host_cdc_acm:
    version: "2.*"
    rules:
      - if: 'target in ["esp32s3"]'
  espressif/esp_websocket_client:
    version: "^1.2.0"
