## IDF Component Manager Manifest File
dependencies:
  espressif/led_strip:
    # 3.1+ needs ESP-IDF 5.4.2; the ESP32-S3 platform ships 5.4.0 (#1869).
    version: "~3.0.3"
    rules:
      - if: 'target in ["esp32s3"]'
  espressif/usb_host_cdc_acm:
    version: "2.*"
    rules:
      - if: 'target in ["esp32s3"]'
  espressif/esp_websocket_client:
    version: "^1.2.0"
