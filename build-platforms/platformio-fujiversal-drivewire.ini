[fujinet]
build_platform = BUILD_COCO
build_bus = DRIVEWIRE
; Needed by build_pico.py's board guard, which refuses to build a companion
; image unless the ini it is reading names the board being built -- that is
; what stops one board's cartridge firmware leaking into another's image.
build_board = fujiversal-drivewire
; Distinct zip name: build_firmwarezip.py otherwise names the zip after
; build_platform, and this would collide with the real COCO board's.
platform_name = FUJIVERSAL-DRIVEWIRE

; CoCo cartridge firmware, from the pico/fujiversal submodule (pinned; run
; `git submodule update --init pico/fujiversal` after a fresh clone).
pico_src        = pico/fujiversal
pico_chip       = rp2350            ; RP2350B on the Core2350B carrier
pico_build      = cmake-ninja
; Must be build/<BOARD>: that tree's board_defs.h includes its cartridge ROM
; as "build/<BOARD>/rom.h" relative to its own source root, so the cmake
; build dir and the generated header have to be the same place.
pico_build_dir  = build/coco_proto_260402
pico_build_type = Release
; Render the HDB-DOS cartridge ROM to the C header the firmware includes.
; Upstream's Makefile does this with xxd inside a container; rom2h.py is the
; same output without needing either.
pico_prebuild   =
    python3 {repo}/pico/tools/rom2h.py disk_rom hdbdw3bc3.rom build/coco_proto_260402/rom.h
; Selects the board's pin map and PIO program. Not pico_board: that tree
; sets PICO_BOARD itself from BOARD.
pico_cmake_args =
    -DBOARD=coco_proto_260402
pico_artifacts  =
    coco_fw = fujiversal_coco_proto_260402.bin

; The declared flash size of the RP2350B module. This firmware keeps nothing
; else in flash, so the limit is only a sanity check on a runaway image --
; but note the declared size comes from the module definition and a smaller
; physical part would not be caught here.
pico_flash_base  = 0x10000000
pico_flash_limit = 0x11000000

[env:fujiversal-drivewire]
platform = espressif32@${fujinet.esp32s3_platform_version}
platform_packages = ${fujinet.esp32s3_platform_packages}
board = esp32-s3-wroom-1-n16r8
build_type = debug
build_flags =
	${env.build_flags}
	-D PINMAP_FUJIVERSAL_DRIVEWIRE
    -D CONFIG_USB_HOST_ENABLED=1
    -D CONFIG_USB_CDC_ACM_HOST_ENABLED=1
    ; Compiles in the updater that flashes the cartridge at boot. Required
    ; whenever [fujinet] pico_src is set -- build_pico.py enforces it.
    -D CONFIG_USB_PICOBOOT_HOST_ENABLED=1
