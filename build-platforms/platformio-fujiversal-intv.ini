[fujinet]
build_bus = RS232
build_platform = BUILD_RS232
build_board = fujiversal-intv

[env:fujiversal-intv]
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_type = debug
build_flags =
    ${env.build_flags}
    -D PINMAP_FUJIVERSAL_INTV
    -D CONFIG_USB_HOST_ENABLED=1
    -D CONFIG_USB_CDC_ACM_HOST_ENABLED=1
    -D CONFIG_USB_PICOBOOT_HOST_ENABLED=1
platform = espressif32@${fujinet.esp32s3_platform_version}
platform_packages = ${fujinet.esp32s3_platform_packages}
board = esp32-s3-wroom-1-n16r8
; A plain (non-"+=") key here replaces [env]'s extra_scripts entirely per
; PlatformIO's own inheritance rules (this repo's create-platformio-ini.py
; merge strips the "+" before writing the merged ini, so a cross-file "+="
; wouldn't survive to reach PlatformIO's own parser anyway) -- so the
; [env] list is spelled out here in full, with build_pico_intv.py appended
; (cleanup_pico_intv.py is a no-op for this board -- it only acts when
; PIOENV != fujiversal-intv -- but is kept in the list for consistency).
; build_pico_intv.py builds pico/intellivision/firmware/ (RP2040, a separate
; CMake+Ninja project), generates lib/hardware/fuji_intv_bin_data.cpp from
; the result, and hard-fails this whole build if it can't -- see that
; script's own header comment for why this isn't done via
; board_build.embed_files or EMBED_FILES (both real PlatformIO/ESP-IDF
; features, but neither one's output reaches this project's actual final
; link step).
extra_scripts =
    pre:build_packages.py
    pre:build_version.py
    pre:build_webui.py
    pre:cleanup_pico_intv.py
    pre:build_pico_intv.py
    post:build_merge_intv.py
