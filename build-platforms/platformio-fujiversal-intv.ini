[fujinet]
build_bus = RS232
build_platform = BUILD_RS232
build_board = fujiversal-intv
; Distinct zip name: this board shares build_platform = BUILD_RS232 with
; fujiversal-rs232/-o2/-msx, and build_firmwarezip.py falls back to that for
; the zip name, so without this they would all be "fujinet-RS232-*.zip".
platform_name = FUJIVERSAL-INTV

; RP2354A companion firmware (the FujiCard cartridge). build_pico.py lives in
; the SHARED [env] extra_scripts list (platformio-ini-files/
; platformio.common.ini) and no-ops for any board whose [fujinet] has no
; pico_src -- nothing needs to respell extra_scripts here any more.
pico_src        = pico/intellivision/firmware
pico_board      = fujicard
pico_chip       = rp2350            ; RP2354A is an RP2350 die + stacked flash
pico_build_type = Release
pico_artifacts  =
    intv_fw = Minty_{pico_board}.bin

; The cart's LittleFS -- user ROMs and JLP saves -- starts at flash offset
; 0x100000 of the 2 MB part (see src/littlefs_backend.c in the firmware).
; Erasing into it would be data loss, so cap the image below it: both the
; build and the ESP32-side flasher refuse to cross this.
pico_flash_base  = 0x10000000
pico_flash_limit = 0x10100000

; Fold bootloader+partition-table+app into one flashable file (build_merge.py)
; and make `build.sh -u` flash that single file. Deliberately excludes the
; LittleFS storage partition -- that stays on `build.sh -f` / -t uploadfs.
merge_bin = yes

[env:fujiversal-intv]
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_type = debug
build_flags =
    ${env.build_flags}
    -D PINMAP_FUJIVERSAL_INTV
    -D CONFIG_USB_HOST_ENABLED=1
    -D CONFIG_USB_CDC_ACM_HOST_ENABLED=1
    ; Compiles in the updater that flashes the companion RP2354 at boot.
    ; Required whenever [fujinet] pico_src is set -- build_pico.py enforces it.
    -D CONFIG_USB_PICOBOOT_HOST_ENABLED=1
platform = espressif32@${fujinet.esp32s3_platform_version}
platform_packages = ${fujinet.esp32s3_platform_packages}
board = esp32-s3-wroom-1-n16r8
