[fujinet]
build_platform = BUILD_COCO
build_bus      = DRIVEWIRE
build_board    = fujinet-coco-es3c28p

[env]
upload_port = /dev/ttyACM0
upload_speed = 460800
monitor_port = /dev/ttyACM0
monitor_speed = 115200

; LCDWiki ES3C28P 2.8" ESP32-S3 "CYD" (N16R8): CoCo DriveWire server over
; Becker-over-IP (WiFi), disks on the 4-bit SDMMC microSD slot.
[env:fujinet-coco-es3c28p]
platform = espressif32@${fujinet.esp32s3_platform_version}
platform_packages = ${fujinet.esp32s3_platform_packages}
board = esp32-s3-wroom-1-n16r8
build_type = debug
build_flags =
    ${env.build_flags}
    -D PINMAP_COCO_ES3C28P
    -D FUJINET_CYD
