[fujinet]
build_bus = RS232
build_platform = BUILD_RS232
build_board = fujiversal-atari5200
platform_name = FUJIVERSAL-ATARI5200

; The cartridge's RP2354B firmware, which the S3 flashes at boot: the RP's USB goes to the S3
; alone.
pico_src        = pico/atari-5200/firmware
pico_board      = fuji5200_rp2354b
pico_chip       = rp2350            ; RP2354B is an RP2350 die + stacked flash
pico_build_type = Release
; CONFIG from firmware/baked/: a FUJI_GEN that does not exist keeps a stale build/gen out
pico_cmake_args =
    -DFUJI_GEN={repo}/{build_dir}/none
pico_artifacts  =
    a52_fw = fuji5200.bin

; The RP2354B's 2 MB; the cart keeps nothing else in flash.
pico_flash_base  = 0x10000000
pico_flash_limit = 0x10200000

[env:fujiversal-atari5200]
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_type = debug
build_flags =
    ${env.build_flags}
    -D PINMAP_FUJIVERSAL_ATARI5200
    '-D FUJI_EOL="\x9b"'
    -D CONFIG_USB_HOST_ENABLED=1
    -D CONFIG_USB_CDC_ACM_HOST_ENABLED=1
    -D CONFIG_USB_PICOBOOT_HOST_ENABLED=1
platform = espressif32@${fujinet.esp32s3_platform_version}
platform_packages = ${fujinet.esp32s3_platform_packages}
board = esp32-s3-wroom-1-n16r8
