[fujinet]
build_bus = RS232
build_platform = BUILD_RS232
build_board = fujiversal-trs80m1
platform_name = FUJIVERSAL-TRS80M1

; The card's RP2354B firmware, which the S3 flashes at boot: the RP's USB goes to the S3
; alone.
pico_src        = pico/trs80m1/firmware
pico_board      = fujitrs80m1_rp2354b
pico_chip       = rp2350            ; RP2354B is an RP2350 die + stacked flash
pico_build_type = Release
pico_artifacts  =
    m1_fw = fujitrs80m1.bin

; The RP2354B's 2 MB, short of its last sector, which keeps the card's settings.
pico_flash_base  = 0x10000000
pico_flash_limit = 0x101FF000

[env:fujiversal-trs80m1]
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_type = debug
build_flags =
    ${env.build_flags}
    -D PINMAP_FUJIVERSAL_TRS80M1
    -D CONFIG_USB_HOST_ENABLED=1
    -D CONFIG_USB_CDC_ACM_HOST_ENABLED=1
    -D CONFIG_USB_PICOBOOT_HOST_ENABLED=1
platform = espressif32@${fujinet.esp32s3_platform_version}
platform_packages = ${fujinet.esp32s3_platform_packages}
board = esp32-s3-wroom-1-n16r8
