[fujinet]
build_bus = RS232
build_platform = BUILD_RS232
build_board = fujiversal-astrocade
; Distinct zip name (build_platform is shared with the other RS232-bus
; fujiversal boards; see platformio-fujiversal-intv.ini).
platform_name = FUJIVERSAL-ASTROCADE

; RP2354A companion firmware: the fujicade cart firmware for the
; FujiNet-Astrocade Rev0 PCB (fujinet-hardware Astrocade/rev0).
; build_pico.py (shared [env] extra_scripts) builds it and embeds the image;
; the S3 flashes it over PICOBOOT at boot when its hash changes.
; include/fujiconfigrom.h (the baked-in CONFIG client) is checked in, so the
; plain CMake build needs no prebuild step.
pico_src        = pico/astrocade/firmware
pico_board      = fujicade_rp2354
pico_chip       = rp2350            ; RP2354A is an RP2350 die + stacked flash
pico_build_type = Release
pico_artifacts  =
    astrocade_fw = fujicade.bin

; fuji_store.c keeps its flash image store in the top 512K of the 2 MB part
; (0x180000-0x1FFFFF). Erasing into it would destroy the stored image, so
; cap the firmware image below it: both the build and the ESP32-side
; flasher refuse to cross this.
pico_flash_base  = 0x10000000
pico_flash_limit = 0x10180000

; Fold bootloader+partition-table+app into one flashable file.
merge_bin = yes

[env:fujiversal-astrocade]
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_type = debug
build_flags =
    ${env.build_flags}
    -D PINMAP_FUJIVERSAL_ASTROCADE
    -D CONFIG_USB_HOST_ENABLED=1
    -D CONFIG_USB_CDC_ACM_HOST_ENABLED=1
    ; Compiles in the updater that flashes the companion RP2354 at boot.
    ; Required whenever [fujinet] pico_src is set -- build_pico.py enforces it.
    -D CONFIG_USB_PICOBOOT_HOST_ENABLED=1
platform = espressif32@${fujinet.esp32s3_platform_version}
platform_packages = ${fujinet.esp32s3_platform_packages}
board = esp32-s3-wroom-1-n16r8
