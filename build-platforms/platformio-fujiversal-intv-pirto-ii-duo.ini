[fujinet]
build_bus = RS232
build_platform = BUILD_RS232
build_board = fujiversal-intv-pirto-ii-duo
platform_name = FUJIVERSAL-INTV-PIRTO-II-DUO

; Same ESP32 side as fujiversal-intv, but the cart is a PiRTO II DUO
; (RP2350A, 4 MB flash, SD on the cart MCU), so it gets its own companion image.
pico_src        = pico/intellivision/firmware
pico_board      = pirto_ii_duo
pico_chip       = rp2350
pico_build_dir  = build-pirto_ii_duo    ; fujiversal-intv uses build/
pico_build_type = Release
pico_artifacts  =
    intv_fw = Minty_{pico_board}.bin

; No flash storage partition on this board; the whole 4 MB part is the image's.
pico_flash_base  = 0x10000000
pico_flash_limit = 0x10400000

merge_bin = yes

[env:fujiversal-intv-pirto-ii-duo]
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_type = debug
build_flags =
    ${env.build_flags}
    -D PINMAP_FUJIVERSAL_INTV
    -D CONFIG_USB_HOST_ENABLED=1
    -D CONFIG_USB_CDC_ACM_HOST_ENABLED=1
    -D CONFIG_USB_PICOBOOT_HOST_ENABLED=1
platform = espressif32@${fujinet.esp32s3_platform_version}
platform_packages = ${fujinet.esp32s3_platform_packages}
board = esp32-s3-wroom-1-n16r8
